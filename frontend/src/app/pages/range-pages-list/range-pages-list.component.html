<header class="animate-appear opacity-0 flex flex-col gap-5 mb-8 md:flex-row md:items-end md:justify-between">
    <div>
        <h3 class="m-0 text-3xl font-bold text-gray-800 dark:text-gray-300 md:text-4xl">Grille</h3>
        <p class="m-0 mt-2 text-lg text-gray-500 dark:text-gray-400">
            Créez et organisez vos pages personnalisées.
        </p>
    </div>
    <button type="button" (click)="createPage()"
        class="inline-flex h-12 shrink-0 items-center justify-center self-start rounded-md border-0 bg-gray-800 px-5 text-base font-medium text-white shadow transition-colors hover:bg-gray-700 dark:bg-gray-700 dark:text-gray-300 dark:hover:bg-gray-600 md:self-auto cursor-pointer">
        <i class="fa-solid fa-plus mr-3" aria-hidden="true"></i>
        Nouvelle grille
    </button>
</header>

<div #tableContainer class="animate-appear opacity-0 animation-delay-50 w-full overflow-x-auto rounded-md bg-white shadow-lg transition-colors duration-500 dark:bg-secondary-dark-bg">
    <p-table [value]="rangePages" dataKey="id" [paginator]="rangePages.length > nbRowsPerPage"
        [rows]="nbRowsPerPage" styleClass="range-pages-table min-w-[600px]">
        <ng-template pTemplate="header">
            <tr class="dark:text-gray-300 dark:bg-secondary-dark-bg">
                <th class="bg-white dark:text-gray-300 dark:bg-secondary-dark-bg dark:border-gray-700">Nom</th>
                <th class="bg-white dark:text-gray-300 dark:bg-secondary-dark-bg dark:border-gray-700">Contenu</th>
                <th class="w-44 bg-white text-right dark:text-gray-300 dark:bg-secondary-dark-bg dark:border-gray-700">Actions</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-page>
            <tr class="dark:text-gray-300 dark:bg-secondary-dark-bg">
                <td class="dark:border-gray-700">
                    <button type="button" (click)="openPage(page.id)"
                        class="border-0 bg-transparent p-0 text-left font-normal text-gray-800 hover:text-gray-600 hover:underline dark:text-gray-300 dark:hover:text-white cursor-pointer">
                        {{ page.name }}
                    </button>
                </td>
                <td class="text-gray-500 dark:text-gray-400 dark:border-gray-700">
                    {{ page.blocks.length }} bloc{{ page.blocks.length > 1 ? 's' : '' }}
                </td>
                <td class="dark:border-gray-700">
                    <div class="flex justify-end gap-2">
                        <button type="button" title="Ouvrir" [attr.aria-label]="'Ouvrir ' + page.name"
                            (click)="openPage(page.id)" class="dui-btn dui-btn-ghost dui-btn-sm dui-btn-square">
                            <i class="fa-solid fa-pencil" aria-hidden="true"></i>
                        </button>
                        <button type="button" title="Dupliquer" [attr.aria-label]="'Dupliquer ' + page.name"
                            (click)="duplicatePage(page.id)" class="dui-btn dui-btn-ghost dui-btn-sm dui-btn-square">
                            <i class="fa-solid fa-clone" aria-hidden="true"></i>
                        </button>
                        <button type="button" title="Supprimer" [attr.aria-label]="'Supprimer ' + page.name"
                            (click)="removePage(page.id)"
                            class="dui-btn dui-btn-ghost dui-btn-sm dui-btn-square text-red-600 hover:bg-red-50 dark:text-red-400 dark:hover:bg-red-950">
                            <i class="fa-solid fa-trash-can" aria-hidden="true"></i>
                        </button>
                    </div>
                </td>
            </tr>
        </ng-template>
        <ng-template pTemplate="emptymessage">
            <tr class="dark:text-gray-300 dark:bg-secondary-dark-bg dark:border-gray-700">
                <td colspan="3" class="py-12 text-center">
                    <i class="fa-solid fa-table-cells-large mb-3 text-3xl text-gray-400" aria-hidden="true"></i>
                    <p class="m-0 font-semibold">Aucune page créée</p>
                    <p class="m-0 mt-1 text-sm text-gray-500">Créez une page pour organiser vos premières ranges.</p>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>
