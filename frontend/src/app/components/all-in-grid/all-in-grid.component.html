<table class="table-fixed border-separate border-spacing-1 select-none" aria-label="Seuils all-in en grosses blindes, de 0,5 à 15 BB">
    <thead><tr><th scope="col" class="w-5"><span class="sr-only">Main</span></th>
        @for (rank of ranks; track rank) {
            <th scope="col" class="h-6 rounded bg-gray-200 text-center text-xs font-bold text-gray-900 dark:bg-gray-700 dark:text-white">{{ rank }}</th>
        }
    </tr></thead>
    <tbody>
        @for (row of grid.rows; track i; let i = $index) {
            <tr><th scope="row" class="w-5 rounded bg-gray-200 text-center text-xs font-bold text-gray-900 dark:bg-gray-700 dark:text-white">{{ ranks[i] }}</th>
                @for (cell of row; track cell.hand) {
                    <td tabindex="0" [attr.aria-label]="cell.detail"
                        [pTooltip]="cellTooltip" tooltipPosition="top" tooltipEvent="both"
                        appendTo="body" tooltipStyleClass="all-in-range-tooltip" tooltipZIndex="10000"
                        [showDelay]="0" [hideDelay]="0" [autoHide]="false"
                        class="relative cursor-help overflow-hidden rounded text-center align-middle font-bold shadow ring-1 ring-inset ring-black/20 dark:ring-white/25"
                        [style.width.px]="cellSize" [style.min-width.px]="cellSize" [style.height.px]="cellSize"
                        [style.font-size.px]="fontSize"
                        [style.background]="cell.background" [style.color]="cell.foreground">
                        <span class="relative z-10 rounded-sm px-0.5" [style.background-color]="cell.labelBackground">{{ cell.label }}</span>
                        <ng-template #cellTooltip>
                            <div class="mb-2 flex items-center gap-2 border-b border-gray-600 pb-2">
                                <span class="h-3 w-3 shrink-0 rounded-sm ring-1 ring-white/30" [style.background]="cell.background"></span>
                                <span class="text-sm font-bold text-white">{{ cell.hand }}</span>
                            </div>
                            <div class="text-xs leading-5 text-gray-100">{{ cell.detail.slice(cell.hand.length + 3) }}</div>
                        </ng-template>
                    </td>
                }
            </tr>
        }
    </tbody>
</table>
<div class="mx-1 mt-3 flex h-2 overflow-hidden rounded shadow-sm" aria-hidden="true">
    @for (step of steps; track step) { <span class="flex-1" [style.background]="color(step)"></span> }
</div>
<div class="mx-1 mt-1 flex justify-between text-xs font-semibold text-gray-800 dark:text-gray-100"><span>0,5 BB</span><span>7,5 BB</span><span>15 BB</span></div>
