<section class="flex h-screen overflow-hidden bg-gray-100 dark:bg-main-dark-bg transition-colors duration-500">
    @if (!isGridEditor) {
        <header class="fixed inset-x-0 top-0 z-40 flex h-14 items-center justify-between bg-white px-4 shadow transition-colors duration-500 dark:bg-secondary-dark-bg lg:hidden">
            <button type="button" (click)="commonService.redirectTo('situations')"
                class="flex items-center gap-3 border-0 bg-transparent p-0 text-gray-800 dark:text-gray-300 cursor-pointer">
                <img src="../../../assets/img/logo.png" alt="" class="h-8 w-8">
                <span class="text-lg font-bold">Poker HL</span>
            </button>
            <button type="button" (click)="commonService.mobileMenuOpen = true" aria-label="Ouvrir le menu"
                class="flex h-11 w-11 items-center justify-center rounded-md border-0 bg-transparent text-xl text-gray-800 hover:bg-gray-200 dark:text-gray-300 dark:hover:bg-gray-600 cursor-pointer">
                <i class="fa-solid fa-bars" aria-hidden="true"></i>
            </button>
        </header>
        @if (commonService.mobileMenuOpen) {
            <div (click)="commonService.mobileMenuOpen = false" class="fixed inset-0 z-40 bg-black/50 animate-fadeIn lg:hidden" aria-hidden="true"></div>
        }
        <app-sidebar></app-sidebar>
    }
    <div [ngClass]="{
            'ml-20': !isGridEditor && commonService.isCollapsed,
            'ml-56': !isGridEditor && !commonService.isCollapsed,
            'py-6': !isGridEditor,
            'px-12': !isGridEditor,
            'p-0': isGridEditor,
            'max-lg:!px-4 max-lg:!pb-6 max-lg:!pt-20': !isGridEditor
        }"
        class="app-scrollbar max-lg:!ml-0 flex-grow h-screen overflow-y-auto transition-all duration-500 text-black">
        <router-outlet></router-outlet>
    </div>
</section>
