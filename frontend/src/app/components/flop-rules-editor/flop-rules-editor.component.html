<ng-template #actionOption let-solution>
    <div class="flex items-center gap-2">
        <span class="h-4 w-4 shrink-0 rounded-sm shadow-sm" [style.background]="actionColor(solution?.id)"></span>
        <span class="truncate">{{ solution?.display_name || 'Action' }}</span>
    </div>
</ng-template>

<div class="flex flex-col gap-3">
    @for (rule of rules; track rule.id; let i = $index, first = $first, last = $last) {
    <div class="rounded-md border border-solid border-gray-200 bg-gray-50 p-3 transition-colors duration-500 dark:border-gray-700 dark:bg-main-dark-bg">
        <div class="flex items-start gap-3">
            <span class="mt-1 flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-gray-800 text-xs font-semibold text-white dark:bg-gray-600">{{ i + 1 }}</span>
            <div class="flex min-w-0 flex-1 flex-wrap items-center gap-2">
                @for (condition of rule.conditions; track c; let c = $index, lastCondition = $last) {
                <span class="inline-flex max-w-full items-center rounded-full bg-white text-sm text-gray-800 shadow-sm dark:bg-gray-700 dark:text-gray-200">
                    <button type="button" (click)="openCondition(rule, c)" [title]="'Modifier : ' + describeCondition(condition)"
                        class="min-w-0 truncate border-0 bg-transparent py-1 pl-3 pr-1 text-left text-sm text-inherit cursor-pointer">
                        {{ describeCondition(condition) }}
                    </button>
                    <button type="button" (click)="removeCondition(rule, c)" [attr.aria-label]="'Retirer ' + describeCondition(condition)"
                        class="mr-1 inline-flex h-6 w-6 shrink-0 items-center justify-center rounded-full border-0 bg-transparent text-xs text-gray-500 hover:bg-gray-200 hover:text-gray-800 dark:text-gray-400 dark:hover:bg-gray-600 dark:hover:text-gray-100 cursor-pointer">
                        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                    </button>
                </span>
                @if (!lastCondition) {
                <span class="text-xs font-semibold uppercase text-gray-400">et</span>
                }
                }
                <button type="button" (click)="openCondition(rule)"
                    class="inline-flex h-8 items-center gap-1 rounded-full border border-dashed border-gray-300 bg-transparent px-3 text-sm text-gray-600 transition-colors hover:bg-gray-100 dark:border-gray-600 dark:text-gray-300 dark:hover:bg-gray-700 cursor-pointer">
                    <i class="fa-solid fa-plus text-xs" aria-hidden="true"></i>
                    Condition
                </button>
            </div>
        </div>
        <div class="mt-3 flex flex-wrap items-center gap-2 pl-9">
            <span class="text-sm text-gray-500 dark:text-gray-400">Action</span>
            <p-dropdown [(ngModel)]="rule.solutionId" [options]="actions" optionLabel="display_name" optionValue="id"
                placeholder="Choisir une action" [inputId]="'rule-action-' + rule.id" styleClass="w-48" appendTo="body" [baseZIndex]="10000">
                <ng-template pTemplate="selectedItem" let-solution>
                    <ng-container *ngTemplateOutlet="actionOption; context: { $implicit: solution }"></ng-container>
                </ng-template>
                <ng-template pTemplate="item" let-solution>
                    <ng-container *ngTemplateOutlet="actionOption; context: { $implicit: solution }"></ng-container>
                </ng-template>
            </p-dropdown>
            <div class="ml-auto flex gap-1">
                <button type="button" (click)="moveRule(i, -1)" [disabled]="first" title="Monter" aria-label="Monter la règle"
                    class="dui-btn dui-btn-ghost dui-btn-sm dui-btn-square text-gray-700 hover:bg-gray-200 disabled:opacity-40 dark:text-gray-300 dark:hover:bg-gray-700">
                    <i class="fa-solid fa-arrow-up" aria-hidden="true"></i>
                </button>
                <button type="button" (click)="moveRule(i, 1)" [disabled]="last" title="Descendre" aria-label="Descendre la règle"
                    class="dui-btn dui-btn-ghost dui-btn-sm dui-btn-square text-gray-700 hover:bg-gray-200 disabled:opacity-40 dark:text-gray-300 dark:hover:bg-gray-700">
                    <i class="fa-solid fa-arrow-down" aria-hidden="true"></i>
                </button>
                <button type="button" (click)="removeRule(i)" title="Supprimer" aria-label="Supprimer la règle"
                    class="dui-btn dui-btn-ghost dui-btn-sm dui-btn-square text-red-600 hover:bg-red-50 dark:text-red-400 dark:hover:bg-red-950">
                    <i class="fa-solid fa-trash-can" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    </div>
    }

    <button type="button" (click)="addRule()"
        class="inline-flex h-10 items-center justify-center gap-2 rounded-md border border-dashed border-gray-300 bg-transparent px-4 text-sm font-medium text-gray-700 transition-colors hover:bg-gray-100 dark:border-gray-600 dark:text-gray-300 dark:hover:bg-gray-700 cursor-pointer">
        <i class="fa-solid fa-plus" aria-hidden="true"></i>
        Ajouter une règle
    </button>

    <div class="flex flex-wrap items-center gap-3 rounded-md border border-solid border-gray-200 p-3 dark:border-gray-700">
        <span class="text-sm font-semibold text-gray-800 dark:text-gray-300">Sinon</span>
        <span class="text-sm text-gray-500 dark:text-gray-400">(aucune règle ne correspond)</span>
        <p-dropdown [ngModel]="defaultSolutionId" (ngModelChange)="defaultSolutionIdChange.emit($event)" [options]="actions"
            optionLabel="display_name" optionValue="id" placeholder="Choisir une action" inputId="rule-default-action"
            styleClass="w-48 ml-auto" appendTo="body" [baseZIndex]="10000">
            <ng-template pTemplate="selectedItem" let-solution>
                <ng-container *ngTemplateOutlet="actionOption; context: { $implicit: solution }"></ng-container>
            </ng-template>
            <ng-template pTemplate="item" let-solution>
                <ng-container *ngTemplateOutlet="actionOption; context: { $implicit: solution }"></ng-container>
            </ng-template>
        </p-dropdown>
    </div>
</div>

<app-flop-condition-dialog [open]="dialogOpen" [condition]="editedCondition" [street]="street" (saved)="onConditionSaved($event)" (closed)="closeDialog()">
</app-flop-condition-dialog>
