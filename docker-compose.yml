services:
  pokerhl:
    build: .
    image: pokerhl:latest
    container_name: pokerhl
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    # Réseau partagé avec le conteneur MariaDB : DB_HOST = nom du conteneur MariaDB
    networks:
      - db-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  db-net:
    external: true
