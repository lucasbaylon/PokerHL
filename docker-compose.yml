services:
  pokerhl:
    build: .
    image: pokerhl:latest
    container_name: pokerhl
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
    # Réseau de l'hôte : l'appli écoute directement sur le port 3000 du VPS
    # et joint le MySQL installé sur le VPS via DB_HOST=localhost
    network_mode: host
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
